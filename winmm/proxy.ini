; proxy.ini - configuration for winmm.dll proxy
;
; Place this file in the same folder as winmm.dll (the game folder).
;
; DllPath examples:
;   DllPath=proxy.dll          <- relative: looks for proxy.dll next to winmm.dll
;   DllPath=C:\tools\hack.dll  <- absolute: loads from the exact path given
;
; If the file is not found winmm.dll silently does nothing.
; The loaded DLL is manual-mapped (invisible to anti-cheat module scanners).

[Proxy]
DllPath=proxy.dll
